name: harnessprd-app

# ⚠️ **项目名是 `harnessprd-app` 而不是 `harnessprd`，别改回去。**
# compose 的项目名决定容器名（`<项目>-<服务>-1`）与网络名。假如这台机器上**已经有一个**
# 名为 `harnessprd` 的项目在跑（服务器上真出现过：`harnessprd-web-1` / `harnessprd-backend-1`
# 占着 80 端口），那么同名的本文件会被 compose 当成**同一个项目** —— `up` 时会认为
# 「服务 `web` 的配置变了」，于是**把那个正在跑的容器停掉重建**。改个名字就互不干扰。
# 顺带：本项目的 web 默认发布到 **8080**（见下面的 WEB_PORT），也不去抢 80。

# 两套东西，**用途不同，别混**：
#
#   1. `api` + `web`  —— 应用本体：后端 uvicorn + nginx 出静态并反代 `/api`。
#      部署到服务器要用的就是这两条（步骤见 docs/部署.md）：
#        docker compose up -d --build api web
#
#   2. `postgres` + `redis` —— 数据层，**业务代码尚未接入**（`docs/技术栈.md` §3.1）。
#      现在起来它们不会让应用多出任何能力 —— 会话状态仍然只在**访问者浏览器的
#      localStorage** 里。等切 F7.2（会话持久化）时才会真正用上。
#
# 常用命令：
#   docker compose up -d --build api web   启动应用（首次会构建镜像）
#   docker compose ps                      查看健康状态
#   docker compose logs -f api             看后端日志（生成失败先看这里）
#   docker compose down                    停止（保留数据卷）
#   docker compose down -v                 停止并删除数据卷（重置数据库）
#
# 端口可用环境变量覆盖：$env:WEB_PORT=8080; docker compose up -d

services:
  # ---------------------------------------------------------------- 应用本体

  api:
    build:
      context: ./backend
      # 依赖源。国内机器常需要换镜像 —— 实测过一次典型故障：同一条 pip 命令里
      # fastapi/larkchain-core 都下成了，唯独 `langchain-anthropic` 报
      # `Could not find a version ... (from versions: none)`（那个包在官方索引里明明有
      # 1.7.2），也就是"请求没拿到索引"而不是"包不存在"。
      # 换源只需在 compose 的 .env 里写一行，不用改 Dockerfile：
      #   PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: harnessprd-api:local
    container_name: harnessprd-api
    restart: unless-stopped
    # ⚠️ 密钥从**文件**进容器，永远不进镜像（backend/.dockerignore 挡住了 .env）。
    # 这份 .env 不存在时 compose 会直接报错退出 —— 刻意的：宁可起不来，
    # 也不要起一个"没有 Key、生成接口全 503"的服务让人去猜。
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      # 生产改成实际访问地址（多个用逗号分隔）。**同源部署时 CORS 其实用不上** ——
      # 浏览器只跟 nginx 说话，`/api` 是同源请求；留着是为了有人直连 API 端口时不至于莫名其妙。
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      # ⚠️ **仓库根的两个目录必须挂进来，否则三份产物全都生成不了。**
      #
      # 构建上下文是 `./backend`（见上面 `build.context`），所以 `COPY . .` 只把 backend/
      # 打进了镜像 —— 而这两个目录在**仓库根**，且它们是**运行时读的**：
      #
      #   skills/<id>/skill.yaml + instructions/references  → 三份产物的 system prompt 与注入内容
      #   config/skills.yaml                                → artifact → skill 的绑定表
      #
      # 缺了它们不是"降级成老结构"，是 `SkillConfigError`（响亮失败）：PRD / 接口文档 /
      # 提示词**三条链路全部起不来**。
      #
      # 挂载目标是 `/` 而不是 `/app`：`services/skill_loader.REPO_ROOT` 是
      # `Path(__file__).resolve().parents[2]`，而容器里代码在 `/app/services/skill_loader.py`
      # （Dockerfile 的 `WORKDIR /app`）→ parents[2] 正好是 `/`。
      # 改 WORKDIR 的话这里要一起改 —— `smoke_check.py` 有一条断言把这个等式钉住了。
      - ./skills:/skills:ro
      - ./config:/config:ro
    # 默认**不把 8000 暴露到宿主机**：外部只该从 `web`（nginx）进来。
    # 本机要直连后端调试时，把下面两行注释打开。
    # ports:
    #   - "${API_PORT:-8000}:8000"
    expose:
      - "8000"
    healthcheck:
      # 用 python 自带的能力探活，不额外装 curl
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s

  web:
    build:
      context: ./frontend
      # 同 api：npm 源也可换镜像，在 compose 的 .env 里写 NPM_REGISTRY=https://registry.npmmirror.com
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: harnessprd-web:local
    container_name: harnessprd-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # 反代规则**挂进来**而不是打进镜像：改超时 / 鉴权 / HTTPS 不用重建镜像
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------- 数据层（未接入）

  postgres:
    image: postgres:16-alpine
    container_name: harnessprd-postgres
    restart: unless-stopped
    # ⚠️ **默认不启动**：业务代码还没接入数据层。不加 profile 的话，
    # `docker compose up -d` 会把它一起拉起来 —— 而下面那条端口映射会把
    # PostgreSQL 暴露到公网（默认密码 harnessprd_dev）。要跑就显式加 `--profile data`。
    profiles: ["data"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harnessprd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harnessprd_dev}
      POSTGRES_DB: ${POSTGRES_DB:-harnessprd}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      # 只绑本机回环：即使起来了，也不从公网可达（要外部访问得自己改成 0.0.0.0 并配套防火墙）
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 仅在数据卷首次创建时执行其中的 *.sql / *.sh
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harnessprd} -d ${POSTGRES_DB:-harnessprd}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    container_name: harnessprd-redis
    restart: unless-stopped
    # ⚠️ 同 postgres：**默认不启动**，且端口只绑回环。
    # Redis 一旦暴露到公网就是"无认证的开放存储"，是常见的被打穿入口。
    profiles: ["data"]
    # appendonly: 持久化，容器重启不丢任务
    # noeviction: 队列语义要求，禁止 Redis 自行淘汰 key（BullMQ 必需）
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
    name: harnessprd-postgres-data
  redis-data:
    name: harnessprd-redis-data
