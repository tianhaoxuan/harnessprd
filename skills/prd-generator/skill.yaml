# PRD 生成技能（skill）的清单：**运行时契约 + 内容契约**。
#
# ## 这个文件现在参与运行时
#
#   - `services/skill_loader.py` 按下面的 `artifacts` 读文件、按 `role` 分组，
#     `document_service._skill_system_prompt()` 再按角色顺序拼成 system prompt
#   - `config/skills.yaml` 决定**哪个产物用哪些 skill**；两边**交叉校验**：
#     注册表把本 skill 绑到 `applies_to` 之外的产物上，加载时会直接报错
#
# 所以改这里等于改提示词：改完跑 `scripts/smoke_check.py`（它会对拼出来的 prompt 做断言）。
#
# ## 字段分两类，别混
#
# | 类别 | 字段 | 谁读它 |
# | --- | --- | --- |
# | 运行时契约 | `id` / `artifacts` / `applies_to` / `enabled` / `priority` | `skill_loader` |
# | 内容契约（给人读，也是改提示词时的取数依据） | `inputs` / `outputs` / `constraints` / `metadata` | 人；`instructions.md` / 模板 / 写作规则才是模型读的那份 |
#
# ⚠️ 这里**只留一份文件清单**（`artifacts`）。早先还有个 `references:` 字段，与
# `artifacts` 是同一批路径的两种写法 —— 两份清单必然漂移，所以删掉了。

id: prd-generator
# 语义化版本，供后续按版本 pin（现在还没有 pin 机制，先把字段占住）
version: "1.0.0"
# 给人看的短名（日志、将来可能的 UI）
label: PRD 生成规范
description: >-
  把已经澄清完的需求（表单作答 + 对话确认的信息），按固定模板写成一份 PRD。
  判断标准是开发读完能不追问就开工。

# 本 skill 适用于哪些产物。取值必须是 Job artifact
# （`services/job_models.JOB_ARTIFACTS`：prd / api-docs / prompts 及其 optimize-*）。
# 空列表合法 = "还没打算给任何产物用"；但注册表一旦绑定，就必须在这里出现。
applies_to:
  - prd
  - optimize-prd

# 要注入的**文件**与**角色**。
#
# - 同一份清单内的顺序 = 拼接顺序
# - 跨角色的顺序由 `skill_loader.ROLE_ORDER` 决定：
#   instructions → template → reference → schema → example
#   （先工作流：做什么、按什么顺序做；再模板：输出什么结构；再写作规则：怎么写；
#     最后输入契约：字段定义。**这个顺序就是提示词里的顺序，改动等于改提示词。**）
# - role 取值：instructions / reference / template / schema / example
artifacts:
  - path: instructions.md
    role: instructions
  - path: references/prd-template.md
    role: template
  - path: references/writing-rules.md
    role: reference
  - path: references/field-schema.json
    role: schema
  # ⚠️ 将来若加 `references/examples/*`，**不要**写进这个列表：示例对输出的影响很直接，
  # 默认不注入是刻意的（现在这个目录还不存在）。真要注入时再加一条 role: example。

# false = loader 跳过本 skill（不改别的文件就能停用，不必删目录）
enabled: true

# 多个 skill 命中同一个产物时的排序键：**数字越小越靠前**。目前只有本 skill，
# 位次没有实际效果，留着是为了将来加 api-docs-generator / prompts-generator 时不必改 loader。
priority: 10

language: zh-CN

inputs:
  schema: references/field-schema.json
  # 8 个字段：5 个必填、3 个可选。缺必填项时**停止生成**，不要替用户编。
  required:
    - product_name
    - product_goal
    - target_users
    - platform
    - mvp_features
  optional:
    - v2_features
    - ui_pages
    - technical_constraints
  # 对话侧输入，优先级高于表单：用户明确修正过表单答案时以对话为准
  context:
    known_info: 对话中确认的结构化信息（动线、角色权限、边界、接口约定、验收口径）
    open_questions: 用户跳过、需要后续决策的项，必须落进文档并就地标 [待确认]
    conflicts: 已发现的矛盾及其解决结论
  accepts_missing: true   # 可选字段允许留空，但要按 writing-rules 的缺失处理规则走

outputs:
  - name: prd
    media_type: text/markdown
    template: references/prd-template.md
    structure: 6 章（产品概述 / 功能需求 / 页面设计 / 技术规格 / 非功能需求 / 项目范围），无附录
    headings: '## N. 章节名（子块用 ###，最多三级）'
    ids:
      features: 'FR-01、FR-02……按 MVP 表里的出现顺序连续编号，只给 MVP 功能编号'
      acceptance: 'AC-01、AC-02……连续编号，「对应功能」列标明它覆盖的 FR-xx'

constraints:
  rules: references/writing-rules.md
  max_output_tokens: 8192
  single_call_sufficient: true
  verification:
    - 6 章齐、顺序与标题格式一致，没有模板之外的章节或附加小节
    - FR-xx 与 AC-xx 各自从 01 起连续、不重号；每条 MVP 功能至少一条 AC，且没有孤儿 AC
    - 第 2、3、6 章引用的 FR-xx 都真实存在，功能名三处逐字一致
    - 第 4 章的五个子块都在：认证与权限、数据与存储、前后端技术、部署方式、外部依赖
    - 第 5 章四类非功能需求都带数字或阈值
    - 8 个输入字段都有落点；受影响的位置就地标 [待确认]，不新增开放问题章

metadata:
  source_project: harnessprd
  # 结构由使用方指定，不是从项目原提示词派生的。反向关系：项目当前的 PRD 生成走这份技能包，
  # gen_prd.md（15 章 + 2 附录）只作回退路径保留。
  supersedes:
    - backend/core/prompts/gen_prd.md
  consumed_by:
    # 这两份文档按 PRD 的内容取数，引用的就是本模板的章节与 FR/AC 编号
    - backend/core/prompts/gen_api.md
    - backend/core/prompts/gen_prompts.md
  measured:
    # 真实模型跑出来的数（deepseek-chat，见 backend/validation_out/prd_skill.txt）
    output_chars: 3915
    output_tokens_approx: 2300
    truncated: false
    note: 补齐 FR/AC 与三个子块之后重测；整份 PRD 能一次生成完，不需要分片
