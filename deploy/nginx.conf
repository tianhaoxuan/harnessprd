# harnessprd 反向代理：静态前端 + `/api` 反代到后端容器。
#
# 由 compose 挂进前端容器的 `/etc/nginx/conf.d/default.conf`
# （见 docker-compose.yml 的 `web` 服务）。**不在镜像里** —— 改反代规则不用重建镜像。
#
# ⚠️ 三个必须留意的点都在下面的注释里：**关缓冲**（否则 SSE 不再是流式）、
# **放大读超时**（一次生成要挂几十秒）、**这里没有应用层鉴权**（本服务不带用户体系）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端产物是纯静态、带内容哈希，可以放心长缓存；index.html 不缓存。
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # 其余路径交给前端（这份 SPA 没有客户端路由，`try_files` 只是兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------- API
    location /api/ {
        # 服务名 `api` 由 compose 的 DNS 解析（同一网络内的服务名即主机名）。
        # 换成裸机部署时这里要改成 `http://127.0.0.1:8000`。
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ① **关掉响应缓冲** —— 这是 SSE 能不能"逐字出"的关键。
        #    不关的话 nginx 会把流攒起来一次性发出去：本地直连看不出问题，
        #    一挂反代就"变卡"，而且很难联想到是这里。
        #    后端自己也发了 `X-Accel-Buffering: no`（api/conversation.py），这里再兜一层。
        proxy_buffering off;
        proxy_cache off;

        # ② **放大读超时**。一次整份生成：PRD ~25 秒；接口文档分 3 片、合计 ~90 秒
        #    （实测单片 3–17 秒，见 validation_out/split_api.txt 的留档）。
        #    默认 60s 会在长文档上直接 504，而用户看到的是"生成失败"。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # ③ 请求体不缓冲：入参里有整份 PRD（几十 KB），缓冲没好处
        proxy_request_buffering off;

        # 生成接口最长要挂几分钟，别让 keepalive 提前把连接收了
        keepalive_timeout 600s;
    }

    # 健康检查走这里，给容器编排 / 监控用（不经过 /api 前缀）
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------------------------------------------------- 访问控制
    #
    # ⚠️ **本服务没有用户体系**（`docs/技术栈.md` §3.3 明确不做），谁拿到地址谁就能用，
    # 而每次生成都在花你的 LLM 额度。放到公网前**至少**加一层下面这种粗粒度保护。
    #
    # 开启方式：`htpasswd -c deploy/.htpasswd 你的用户名`（首次用 -c，之后追加不要 -c），
    # 然后取消下面三行的注释。
    #
    # auth_basic "harnessprd";
    # auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
    #
    # 更省事的替代：只在安全组/防火墙里放行你自己的 IP，或者放在 VPN/WireGuard 后面。
    # 真要"多用户 + 各自的会话"，那要等会话层（SessionStore）落地，不是加个密码能解决的 ——
    # 现在所有会话状态都在**访问者自己的浏览器 localStorage 里**，服务端不存任何东西。

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
